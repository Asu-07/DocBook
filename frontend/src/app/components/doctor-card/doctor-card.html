<article class="doctor-card card card--hover">
  <div class="doctor-card__image-wrap">
    <img [src]="image()" [alt]="name()" class="doctor-card__image" />
    <span class="doctor-card__rating">
      <svg class="doctor-card__star" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"
        />
      </svg>
      {{ rating() }}
    </span>
  </div>

  <div class="doctor-card__body">
    <h3 class="doctor-card__name">{{ name() }}</h3>
    <span class="doctor-card__specialization">{{ specialization() }}</span>
    <p class="doctor-card__experience">{{ experience() }} years experience</p>
    <a class="btn btn--primary btn--block" [routerLink]="['/book-appointment', doctorId()]">Book Appointment</a>
  </div>
</article>
